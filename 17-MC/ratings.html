<!-- 

ratings

- display 5 outlined stars
- if user click, star gets toggled from outline to full and vice versa
- if user selects 4, then it has to be from 0 to 4, not four alone

good to have

- mouseover, mouseleave
- partial ratings
- emojis instead of number
- feedback form

 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h3 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .outline,
        .fill {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        .count {
            margin-top: 1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>

<body>
    <h3>Please leave a rating🙏</h3>
    <div id="ratings">
        <img class="rate outline"
            id="1"
            src="https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80"
            alt="">
        <img class="rate outline"
            id="2"
            src="https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80"
            alt="">
        <img class="rate outline"
            id="3"
            src="https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80"
            alt="">
        <img class="rate outline"
            id="4"
            src="https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80"
            alt="">
        <img class="rate outline"
            id="5"
            src="https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80"
            alt="">
    </div>

    <div class="count">
        Ratings: <span id="rate_count">0</span>
    </div>

    <script>
        const ratingsDiv = document.getElementById("ratings");
        const stars = document.querySelectorAll(".rate");
        const rateCount = document.getElementById("rate_count");


        const handleRating = (e) => {
            const currentEl = e.target;
            const currentId = parseInt(currentEl.getAttribute("id"));
            
            let idx = currentId - 1;
            const isRated = (stars[idx].classList || []).contains("fill");
            const needToOff = (parseInt(rateCount.innerText) - 1) === idx;

            if (!isRated) {
                // fill start to this
                for (let index = 0; index < 5; index++) {
                    if (index <= idx) {
                        stars[index].classList.remove("outline");
                        stars[index].classList.add("fill");

                        stars[index].src = "https://img.icons8.com/color/1200/filled-star.jpg";
                    } else {
                        stars[index].classList.remove("fill");
                        stars[index].classList.add("outline");

                        stars[index].src = "https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80";
                    }
                }
            } else {
                for (let index = 4; index >= 0; index--) {
                    if (index > idx || needToOff) {
                        stars[index].classList.remove("fill");
                        stars[index].classList.add("outline");

                        stars[index].src = "https://img.freepik.com/premium-photo/minimalist-star-outline-icon_53876-1306814.jpg?semt=ais_hybrid&w=740&q=80";
                    } else {
                        stars[index].classList.remove("outline");
                        stars[index].classList.add("fill");

                        stars[index].src = "https://img.icons8.com/color/1200/filled-star.jpg";
                    }
                }
            }

            rateCount.innerText = needToOff ? 0 : idx + 1;
        }

        ratingsDiv.addEventListener("click", handleRating);

    </script>
</body>

</html>
