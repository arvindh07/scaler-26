<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <span class="loader"></span>
        <div class="top">
            <div class="weather">
                <div class="temp">23</div>
                <div class="dl">
                    <div class="location">Chennai</div>
                    <div class="time">13/03/2026</div>
                </div>
                <div class="condition_container">
                    <div class="emoji">
                        <img src="" alt="">
                    </div>
                    <div class="condition">Condition</div>
                </div>
            </div>
            <div>
                <button class="tempBtn">C / F</button>
            </div>
        </div>
        <div class="middle">
            <!-- past 3 days weather -->
            <h3>Past three days</h3>
            <div class="boxes">
                <div class="past_weather">
                    <img src="" alt="">
                    <p>12/03/2026</p>
                    <p>25 C</p>
                    <p>Sunny</p>
                </div>
                <div class="past_weather">
                    <img src="" alt="">
                    <p>11/03/2026</p>
                    <p>25 C</p>
                    <p>Sunny</p>
                </div>
                <div class="past_weather">
                    <img src="" alt="">
                    <p>10/03/2026</p>
                    <p>25 C</p>
                    <p>Sunny</p>
                </div>
            </div>
        </div>
        <div class="bottom">
            <nav>
                <form>
                    <input type="text" placeholder="Enter location" class="search_input" />
                    <button type="submit" class="search_btn">Search</button>
                    <button type="button" class="my_location_btn">My location</button>
                </form>
            </nav>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
